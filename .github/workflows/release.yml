name: Release Obsidian plugin
on:
  push:
    tags:
      - "*"
  # Manual runs build and test only, so workflow changes can be checked
  # without publishing anything; the attest and release steps need a tag.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Test
        run: npm test

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # A hyphenated tag (0.6.0-beta.1) is published as a pre-release: BRAT
          # installs those, and the Community Plugins updater ignores them. That
          # is the only way to put a build in front of testers without offering
          # it to everyone who already has the plugin installed.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" $prerelease \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css
