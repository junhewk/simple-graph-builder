name: Release Obsidian plugin
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Test
        run: npm test

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # A hyphenated tag (0.6.0-beta.1) is published as a pre-release: BRAT
          # installs those, and the Community Plugins updater ignores them. That
          # is the only way to put a build in front of testers without offering
          # it to everyone who already has the plugin installed.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" $prerelease \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css
